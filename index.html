<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MVP 세미나 준비 중</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: #f6f7f9;
        color: #1d2430;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(680px, 100%);
        padding: 44px 36px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(29, 36, 48, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        font-size: 22px;
        line-height: 1.5;
        color: #425066;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MVP 세미나 준비 중</h1>
      <p>세미나 준비 완료</p>
    </main>
  </body>
</html>
